<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Carousel 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="sequence2">

        <h1>Dogs are only happy with food in front of them!</h1>

        <div id="sads">
        <img id="sadDog2" src="images/imagesad.jpg" alt="sad dog">
        <img id="sadDog3" src="images/imagesad.jpg" alt="sad dog">
        <img id="sadDog4" src="images/imagesad.jpg" alt="sad dog">
        </div>

        <div id="happys">
        <img id="happyDog2" src="images/imagehappy.jpg" alt="happy dog">
        <img id="happyDog3" src="images/imagehappy.jpg" alt="happy dog">
        <img id="happyDog4" src="images/imagehappy.jpg" alt="happy dog">
        </div>

        <img id="dogTreat2" src="images/dogtreat.png" alt="dog treat">


    </div>


    <div id="treats">
        <img id="treats1" src="images/dogtreat.png" alt="happy dog">
        <img id="treats2" src="images/dogtreat.png" alt="happy dog">
        <img id="treats3" src="images/dogtreat.png" alt="happy dog">
    </div>

    <h1>Give them food by clicking or hovering!</h1>

    <button id="changePage">Click here to go to first sequence</button>

    <script src="script2.js"></script> 
</body>
</html>
