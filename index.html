<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="changePage">Click here to go to second sequence</button>

    <h1 id="firstText">Give the dog his food by clicking on it!</h1>
    <h1 id="secondText">Dog is happy with his food!</h1>


    <script src="script.js"></script>

</html>
